[versions]
agp             = "9.2.1"
annotation      = "1.9.0"
appcompat       = "1.7.0"
commonmark      = "0.30.0"
core            = "1.13.1"
drawerlayout    = "1.2.0"
junit           = "4.13.2"
material        = "1.12.0"
preference      = "1.2.1"
recyclerview    = "1.3.2"
robolectric     = "4.13"
termuxAmLibrary = "v2.0.0"
testExtJunit    = "1.1.5"
viewpager2      = "1.1.0"

[libraries]
androidx-annotation     = { module = "androidx.annotation:annotation",        version.ref = "annotation" }
androidx-appcompat      = { module = "androidx.appcompat:appcompat",           version.ref = "appcompat" }
androidx-core           = { module = "androidx.core:core",                     version.ref = "core" }
androidx-drawerlayout   = { module = "androidx.drawerlayout:drawerlayout",     version.ref = "drawerlayout" }
androidx-preference     = { module = "androidx.preference:preference",         version.ref = "preference" }
androidx-recyclerview   = { module = "androidx.recyclerview:recyclerview",     version.ref = "recyclerview" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit",                version.ref = "testExtJunit" }
androidx-viewpager2     = { module = "androidx.viewpager2:viewpager2",         version.ref = "viewpager2" }
commonmark              = { module = "org.commonmark:commonmark",              version.ref = "commonmark" }
junit                   = { module = "junit:junit",                            version.ref = "junit" }
material                = { module = "com.google.android.material:material",   version.ref = "material" }
robolectric             = { module = "org.robolectric:robolectric",            version.ref = "robolectric" }
termux-am-library       = { module = "com.termux:termux-am-library",           version.ref = "termuxAmLibrary" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library",     version.ref = "agp" }
