buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.2.1"
    }
}

def targetSdkVersionValue = providers.gradleProperty("targetSdkVersion").get().toInteger()
if (targetSdkVersionValue > 28)
    throw new GradleException("targetSdkVersion must stay <= 28: Android 10+ blocks Termux app-data binary execution for apps targeting 29+.")

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}
